[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
  // Some tests check the shipped model files; the assets folder is an input, so editing a model reruns them.
  inputs.dir(rootProject.file("assets/models")).withPathSensitivity(PathSensitivity.RELATIVE)
  systemProperty "gamex.assets", rootProject.file("assets").path
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
