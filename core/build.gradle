[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Tells the tests where the assets folder is. The model files are a test input, so editing one reruns the tests;
// they are tracked by relative path, so the absolute location of the checkout stays out of the build cache key.
class AssetsLocation implements CommandLineArgumentProvider {
  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File models

  @Override
  Iterable<String> asArguments() {
    ["-Dgamex.assets=${models.parentFile.path}".toString()]
  }
}

test {
  useJUnitPlatform()
  jvmArgumentProviders.add(new AssetsLocation(models: rootProject.file("assets/models")))
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
