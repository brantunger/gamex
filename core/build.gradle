[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  // The logging facade only; each application module brings its own binding (desktop and tools use Logback).
  api "org.slf4j:slf4j-api:$slf4jVersion"
  // Loads the .glb models and draws them with its PBR shader. It was built against libGDX 1.9.11; the gdx version
  // above wins.
  implementation "com.github.mgsx-dev.gdx-gltf:gltf:$gltfVersion"

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // The tests' binding, set to WARN by src/test/resources/logback-test.xml; tests also read log lines through it.
  testImplementation "ch.qos.logback:logback-classic:$logbackVersion"
}

// Tells the tests where the assets folder is. Editing a committed model, sound, level, data file, shader or texture
// reruns the tests; paths are tracked relatively to stay out of the build cache key. The data, shaders and textures
// folders are tracked as file trees, which may be empty or missing; the other three must exist.
class TestLocations implements CommandLineArgumentProvider {
  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File models

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File sounds

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File levels

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  FileTree data

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  FileTree shaders

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  FileTree textures

  @Override
  Iterable<String> asArguments() {
    [
      "-Dgamex.assets=${models.parentFile.path}".toString()
    ]
  }
}

test {
  useJUnitPlatform()
  mustRunAfter(':tools:generateModels', ':tools:generateSounds')
  mustRunAfter(':tools:generateTextures')
  jvmArgumentProviders.add(new TestLocations(
    models: rootProject.file("assets/models"),
    sounds: rootProject.file("assets/sounds"),
    levels: rootProject.file("assets/levels"),
    data: rootProject.fileTree("assets/data"),
    shaders: rootProject.fileTree("assets/shaders"),
    textures: rootProject.fileTree("assets/textures")
  ))
  // TunedSimulationTest reads the sources of desktop and tools to see that neither calls a test-only constructor.
  inputs.files(rootProject.fileTree("desktop/src/main/java"), rootProject.fileTree("tools/src/main/java"))
    .withPropertyName("otherModulesSources")
    .withPathSensitivity(PathSensitivity.RELATIVE)
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
