[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Tells the tests where the assets and generator tools folders are. Both are tracked as inputs, so editing a model
// or generator reruns the tests; they are tracked by relative path to stay out of the build cache key.
class TestLocations implements CommandLineArgumentProvider {
  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File models

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File tools

  @Override
  Iterable<String> asArguments() {
    [
      "-Dgamex.assets=${models.parentFile.path}".toString(),
      "-Dgamex.tools=${tools.path}".toString()
    ]
  }
}

test {
  useJUnitPlatform()
  jvmArgumentProviders.add(new TestLocations(
    models: rootProject.file("assets/models"),
    tools: rootProject.file("tools")
  ))
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
