allprojects {
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  // Compiles and runs with a Java 21 toolchain; settings.gradle applies the plugin that can download one.
  java.toolchain.languageVersion = JavaLanguageVersion.of(21)

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'gamex'
  repositories {
    mavenCentral()
    // gdx-gltf, the glTF loader and PBR shader, is published on JitPack only. It is read from there and nowhere
    // else, and nothing else is read from there.
    exclusiveContent {
      forRepository {
        maven {
          url = 'https://jitpack.io'
        }
      }
      filter {
        includeGroup 'com.github.mgsx-dev.gdx-gltf'
      }
    }
  }
}
