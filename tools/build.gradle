[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  // The SLF4J binding for the core classes the tools use; src/main/resources/logback.xml shows warnings and errors only.
  runtimeOnly "ch.qos.logback:logback-classic:$logbackVersion"

  constraints {
    implementation("org.lwjgl:lwjgl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-glfw:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-jemalloc:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-openal:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-opengl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-stb:$lwjgl3Version")
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('generateModels', JavaExec) {
  group = 'gamex'
  description = 'Regenerates all sculpted .obj models in assets/models/'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.brantunger.gamex.tools.GenerateAllModels'
  args = [rootProject.file('assets/models').path]
  outputs.dir(rootProject.file('assets/models'))
}

tasks.register('generateSounds', JavaExec) {
  group = 'gamex'
  description = 'Regenerates all synthesized .wav sound effects in assets/sounds/'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.brantunger.gamex.tools.GenerateAllSounds'
  args = [rootProject.file('assets/sounds').path]
  outputs.dir(rootProject.file('assets/sounds'))
}

tasks.register('generateTextures', JavaExec) {
  group = 'gamex'
  description = 'Regenerates all painted .png textures in assets/textures/'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.brantunger.gamex.tools.GenerateAllTextures'
  args = [rootProject.file('assets/textures').path]
  outputs.dir(rootProject.file('assets/textures'))
}

def previewJvmArgs = [
  '--enable-native-access=ALL-UNNAMED',
  '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED'
]
if (System.properties['os.name'].toLowerCase(Locale.ROOT).contains('mac')) {
  previewJvmArgs += '-XstartOnFirstThread'
}

tasks.register('preview', JavaExec) {
  group = 'gamex'
  description = 'Launches the interactive 3D OBJ model previewer with live regeneration (R)'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.brantunger.gamex.tools.preview.ModelPreviewApp'
  workingDir = rootProject.file('assets').path
  jvmArgs previewJvmArgs
  systemProperty 'gamex.modelsDir', rootProject.file('assets/models').path
}

// Tells the tests where the assets folder is. Editing a model, sound, level, data file, shader or texture reruns
// them. The data, shaders and textures folders are tracked as file trees, which may be empty or missing.
class ToolsAssetsLocation implements CommandLineArgumentProvider {
  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File models

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File sounds

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  File levels

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  FileTree data

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  FileTree shaders

  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  FileTree textures

  @Override
  Iterable<String> asArguments() {
    ["-Dgamex.assets=${models.parentFile.path}".toString()]
  }
}

test {
  useJUnitPlatform()
  mustRunAfter(':tools:generateModels', ':tools:generateSounds')
  mustRunAfter(':tools:generateTextures')
  inputs.files(
    rootProject.file('tools/build.gradle'),
    rootProject.file('core/build.gradle'),
    rootProject.file('desktop/build.gradle')
  ).withPathSensitivity(PathSensitivity.NONE)
  jvmArgumentProviders.add(new ToolsAssetsLocation(
    models: rootProject.file('assets/models'),
    sounds: rootProject.file('assets/sounds'),
    levels: rootProject.file('assets/levels'),
    data: rootProject.fileTree('assets/data'),
    shaders: rootProject.fileTree('assets/shaders'),
    textures: rootProject.fileTree('assets/textures')
  ))
}
