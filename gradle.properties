# This doesn't need to be false, and some projects may be able to take advantage of setting daemon to true.
# We set it to false by default in order to avoid too many daemons from being created and persisting; each needs RAM.
org.gradle.daemon=false
# Sets starting memory usage to 512MB, maximum memory usage to 1GB, and tries to set as much to use Unicode as we can.
org.gradle.jvmargs=-Xms512M -Xmx1G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
# "Configure on-demand" must be false because it breaks projects that have Android modules. The default is also false.
org.gradle.configureondemand=false
# The logging level determines which messages get shown about how Gradle itself is working, such as if build.gradle
# files are fully future-proof (which they never are, because Gradle constantly deprecates working APIs).
# This is 'lifecycle', Gradle's default behavior, which shows the tasks that run and a note when a build uses
# deprecated Gradle features; run with --warning-mode all to see each deprecation warning.
# You can change 'lifecycle' below to 'quiet' to only see errors.
# You could instead change 'lifecycle' below to 'info' to see info that's important mainly while debugging build files.
# Note that if you want to use Gradle Build Scans, the logging level below must be 'lifecycle' or more verbose,
# otherwise the link to the scan won't get shown at all.
# Documented at: https://docs.gradle.org/current/userguide/command_line_interface.html#sec:command_line_logging
org.gradle.logging.level=lifecycle
# The build cache lets Gradle reuse the outputs of tasks it has already run with the same inputs, such as compiled
# classes, instead of running those tasks again. The cache is local, in the Gradle user home.
# Documented at: https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
lwjgl3Version=3.4.3
graalHelperVersion=2.0.1
enableGraalNative=false
gdxVersion=1.14.2
projectVersion=1.0.0
