
buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath "io.github.fourlastor:construo:2.2.2"
  }
}
plugins {
  id "application"
}
apply plugin: 'io.github.fourlastor.construo'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'


import io.github.fourlastor.construo.Target

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application {
  mainClass = 'io.github.brantunger.gamex.desktop.DesktopLauncher'
  applicationName = appName
  // Applies to both the run task and the generated bin/gamex and bin/gamex.bat start scripts for LWJGL3 on JDK 24+.
  applicationDefaultJvmArgs = [
    '--enable-native-access=ALL-UNNAMED',
    '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED'
  ]
}

// From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
// The article can be helpful when using assets.txt in your project.
// This only runs when a file is added to, removed from or changed in the assets folder.
tasks.register('generateAssetList') {
  mustRunAfter(':tools:generateModels', ':tools:generateSounds')
  // projectFolder/assets
  File assetsFolder = rootProject.file('assets')
  // projectFolder/assets/assets.txt
  File assetsFile = new File(assetsFolder, 'assets.txt')
  // all files inside that folder, other than the list itself
  def assets = fileTree(assetsFolder) { exclude 'assets.txt' }
  inputs.files(assets).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.file(assetsFile)

  doLast {
    // convert each file to a relative path
    // and write the sorted paths to the file assets.txt, one per line
    assetsFile.setText(assets.collect { assetsFolder.relativePath(it) }.sort().collect { it + "\n" }.join(), 'UTF-8')
  }
}
processResources.dependsOn 'generateAssetList'
processResources.mustRunAfter(':tools:generateModels', ':tools:generateSounds')

dependencies {
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation project(':core')
  // The SLF4J binding; src/main/resources/logback.xml sends the log to the console.
  runtimeOnly "ch.qos.logback:logback-classic:$logbackVersion"

  // Forces LWJGL3 to use at least $lwjgl3Version, currently 3.4.3, to avoid warnings on Java 25 and up.
  constraints{
    implementation("org.lwjgl:lwjgl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-glfw:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-jemalloc:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-openal:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-opengl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-stb:$lwjgl3Version")
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // Lets the tests read log lines and load logback.xml; src/test/resources/logback-test.xml sets them to WARN.
  testImplementation "ch.qos.logback:logback-classic:$logbackVersion"
}

// Writes the project version into gamex-version.properties, which the launcher logs at startup. It works for the
// run task as well as the JAR, which a manifest attribute would not.
processResources {
  def versionText = projectVersion
  inputs.property('gamexVersion', versionText)
  filesMatching('gamex-version.properties') {
    expand(gamexVersion: versionText)
  }
}

test {
  useJUnitPlatform()
  inputs.dir(project.file("icons")).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(project.file("build.gradle")).withPathSensitivity(PathSensitivity.NONE)
  // The version the launcher should report, for the test that reads gamex-version.properties.
  systemProperty 'gamex.version', projectVersion
}

def os = System.properties['os.name'].toLowerCase(Locale.ROOT)

run {
  workingDir = rootProject.file('assets').path
// You can uncomment the next line if your IDE claims a build failure even when the app closed properly.
  //setIgnoreExitValue(true)
// On macOS, we need to set this for the run task to allow debugging in IDEA or AS to work.
  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
}

// The setup shared by the jar task and the OS-specific jarMac, jarLinux and jarWin tasks below.
// The suffix goes after the version in the name of the .jar file, and is empty for the cross-platform JAR.
def configureFatJar = { Jar task, String suffix ->
// sets the name of the .jar file this produces to the name of the game or app, with the version after.
  task.archiveFileName.set("${appName}-${projectVersion}${suffix}.jar")
// the duplicatesStrategy matters starting in Gradle 7.0; this setting works.
  task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  task.dependsOn configurations.runtimeClasspath
  task.from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
// this "exclude" line removes unnecessary duplicate files and conflicting Multi-Release module descriptors in the output JAR.
  task.exclude(
    'META-INF/INDEX.LIST',
    'META-INF/*.SF',
    'META-INF/*.DSA',
    'META-INF/*.RSA',
    'META-INF/maven/**',
    'module-info.class',
    'META-INF/versions/**/module-info.class'
  )
// Setting the manifest makes the JAR runnable.
// Enabling native access helps avoid a warning when Java 24 or later runs the JAR.
// Setting Multi-Release to true allows LWJGL3 to use different classes on recent Java versions.
// This setting for Add-Exports ensures a warning on recent JDKs is avoided by LWJGL 3.4.2 and later.
  task.manifest {
    attributes 'Main-Class': application.mainClass, 'Enable-Native-Access': 'ALL-UNNAMED', 'Multi-Release': 'true', 'Add-Exports': 'java.base/jdk.internal.misc'
  }
// this last step may help on some OSes that need extra instruction to make runnable JARs.
// The Provider is read here, outside the action, because the configuration cache does not allow an action
// to call script methods such as file() while it runs.
  def archiveFile = task.archiveFile
  task.doLast {
    archiveFile.get().asFile.setExecutable(true, false)
  }
}

jar {
  configureFatJar(it, '')
}

// Builds a JAR that only includes the files needed to run on macOS, not Windows or Linux.
// The file size for a Mac-only JAR is about 7MB smaller than a cross-platform JAR.
tasks.register("jarMac", Jar) {
  group = "build"
  from sourceSets.main.output
  configureFatJar(it, '-mac')
  exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dll", "**/*.so")
}

// Builds a JAR that only includes the files needed to run on Linux, not Windows or macOS.
// The file size for a Linux-only JAR is about 5MB smaller than a cross-platform JAR.
tasks.register("jarLinux", Jar) {
  group = "build"
  from sourceSets.main.output
  configureFatJar(it, '-linux')
  exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**", "**/*.dll", "**/*.dylib")
}

// Builds a JAR that only includes the files needed to run on Windows, not Linux or macOS.
// The file size for a Windows-only JAR is about 6MB smaller than a cross-platform JAR.
tasks.register("jarWin", Jar) {
  group = "build"
  from sourceSets.main.output
  configureFatJar(it, '-win')
  exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dylib", "**/*.so")
}

construo {
  // name of the executable
  name.set(appName)
  // human-readable name, used for example in the `.app` name for macOS
  humanName.set(appName)
  jlink {
    guessModulesFromJar.set(false)
    // You may need to add more modules, as needed.
    // Logback reads logback.xml with java.xml, which java.desktop already brings in; it is named to keep it.
    modules.addAll("java.base", "java.management", "java.desktop", "jdk.unsupported", "java.xml")
  }

  targets.configure {
    register("linuxX64", Target.Linux) {
      architecture.set(Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_linux_hotspot_21.0.10_7.tar.gz")
      // Linux does not currently have a way to set the icon on the executable
    }
    register("macM1", Target.MacOs) {
      architecture.set(Target.Architecture.AARCH64)
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.10_7.tar.gz")
      // macOS needs an identifier
      identifier.set("io.github.brantunger.gamex")
      // Optional: icon for macOS, as an ICNS file
      macIcon.set(project.file("icons/logo.icns"))
    }
    register("macX64", Target.MacOs) {
      architecture.set(Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_mac_hotspot_21.0.10_7.tar.gz")
      // macOS needs an identifier
      identifier.set("io.github.brantunger.gamex")
      // Optional: icon for macOS, as an ICNS file
      macIcon.set(project.file("icons/logo.icns"))
    }
    register("winX64", Target.Windows) {
      architecture.set(Target.Architecture.X86_64)
      // Optional: icon for Windows, as a PNG
      icon.set(project.file("icons/logo.png"))
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_windows_hotspot_21.0.10_7.zip")
      // Uncomment the next line to show a console when the game runs, to print messages.
      //useConsole.set(true)
    }
  }
}

// Equivalent to the jar task; here for compatibility with gdx-setup.
tasks.register('dist') {
  dependsOn 'jar'
}

// The application plugin copies both the jar task's output and every runtimeClasspath JAR into lib/ of the
// distZip and distTar archives. The jar task here already builds a fat JAR holding all of those dependencies,
// and the start scripts below only put that fat JAR on the classpath, so the loose dependency JARs are left out.
// eachFile propagates into the application plugin's child lib/ CopySpec (unlike a root exclude predicate), and
// the files are compared when the archive is built so nothing is resolved while this script is configured.
def distRuntimeClasspath = configurations.runtimeClasspath
distributions {
  main {
    contents {
      eachFile { details ->
        if (distRuntimeClasspath.contains(details.file)) {
          details.exclude()
        }
      }
    }
  }
}

startScripts.dependsOn(':desktop:jar')
startScripts.classpath = project.tasks.jar.outputs.files

// Helps if debugging on Linux with an Nvidia GPU.
// This only applies to Gradle tasks, not main methods debugged when launching a main() method directly.
// As a more general solution, set the environment variable __GL_THREADED_OPTIMIZATIONS to 0 globally, on Linux
// machines with Nvidia GPUs where you need to debug LWJGL3 apps and games.
// You can also set __GL_THREADED_OPTIMIZATIONS to 0 in run configurations, which you would need per main() method.
tasks.withType(JavaExec.class).configureEach {
  environment("__GL_THREADED_OPTIMIZATIONS", 0)
}
